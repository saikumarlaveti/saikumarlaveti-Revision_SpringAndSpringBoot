server:
  port: 9797

spring:
  application:
    name: MSProject-07-ApiGateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: billing-service
              uri: lb://MSProject-07-Billing
              predicates:
                - Path=/fpkt-billing/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: lb://MSPROJECT-07-PAYMENT
              predicates:
                - Path=/fpkt-payment/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/		
management:
  tracing:
   export:
    zipkin:
     enabled: false