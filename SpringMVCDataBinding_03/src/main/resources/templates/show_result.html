<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Details</title>
</head>
<body>

    <h2>Student Details</h2>

    <p>ID : <span th:text="${stud.id}"></span></p>
    <p>Name : <span th:text="${stud.name}"></span></p>
    <p>Age : <span th:text="${stud.age}"></span></p>
    <p>Gender : <span th:text="${stud.gender}"></span></p>

</body>
</html>
